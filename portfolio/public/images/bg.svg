<!-- Linear-esque beams + side-locked aurora glows -->
<svg
  class="top-0 mx-auto h-64 w-full pointer-events-none select-none"
  viewBox="0 0 100 64"
  preserveAspectRatio="none"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  <defs>
    <!-- Fade to let the art melt into the page background -->
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0.95"/>
      <stop offset="1" stop-color="black" stop-opacity="0"/>
    </linearGradient>
    <mask id="vfade"><rect width="100%" height="100%" fill="url(#fadeGrad)"/></mask>

    <!-- Palette: cyan → violet → indigo -->
    <linearGradient id="beam" x1="-120" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="12%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="85%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Soft glow fill (centered radial inside each ellipse) -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Big blur area so glows never get clipped -->
    <filter id="blurSoft" x="-100%" y="-100%" width="300%" height="300%" filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <g mask="url(#vfade)">
    <!-- Side-anchored aurora glows (always left/right) -->
    <g opacity="0.6" filter="url(#blurSoft)">
      <!-- Left glow -->
      <ellipse cx="5%"  cy="18%" rx="24%" ry="35%" fill="url(#orbCyan)"/>
      <!-- Right glow -->
      <ellipse cx="95%" cy="12%" rx="22%" ry="38%" fill="url(#orbViolet)"/>
    </g>

    <!-- Diagonal gradient beams -->
    <g transform="rotate(-12 50 32)" opacity="0.55">
      <rect x="-120" y="6"  width="340" height="1.8" fill="url(#beam)"/>
      <rect x="-120" y="16" width="340" height="2.2" fill="url(#beam)" opacity="0.9"/>
      <rect x="-120" y="28" width="340" height="1.6" fill="url(#beam)" opacity="0.75"/>
      <rect x="-120" y="40" width="340" height="2.0" fill="url(#beam)" opacity="0.8"/>
      <rect x="-120" y="52" width="340" height="1.6" fill="url(#beam)" opacity="0.7"/>
    </g>
  </g>
</svg>
